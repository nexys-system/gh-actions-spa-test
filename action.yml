name: bun-spa-test
description: This GitHub Action will build and test your SPA app using Bun
author: johnb8005
branding:
  icon: book-open
  color: purple
inputs:
  build-command:
    description: build command
    default: VITE_VERSION=${GITHUB_REF##*/} VITE_GIT_SHA=$GITHUB_SHA bun run build
  deploy-project-name:
    description: project name for the deploy service
  deploy-token:
    description: token needed to deploy
  dist-path:
    description: path to the dist directory
    default: dist
  gzip-compression:
    description: compresses files to gzip
    default: true
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v2
    - name: Install dependencies
      run: bun install
      shell: bash
    - name: Test
      run: bun test
      shell: bash
    - name: Build
      run: ${{ inputs.build-command }}
      shell: bash
    - name: Deploy
      run: |
        if [ -n "${{ inputs.deploy-project-name }}" ] && [ -n "${{ inputs.deploy-token }}" ]; then
          echo "deploying";
          # create meta file
          DIST_PATH="${{ inputs.dist-path }}"
          printf "{\"sha\":\"$GITHUB_SHA\",\"version\":\"${GITHUB_REF##*/}\",\"date\":\"$(date -u)\"}" > "$DIST_PATH/meta.json"

          if [ "${{ inputs.gzip-compression }}" = "true" ] ; then
            echo "gzipping files";
            find "$DIST_PATH" -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' \) -exec gzip "{}" \;
            find "$DIST_PATH" -type f -name '*.gz' -exec sh -c 'mv "$0" "${0%.gz}"' {} \;
          fi
          # zip build
          zip -r dist.zip "$DIST_PATH"
          # push to deploy service
          curl -k -X POST -H 'X-TOKEN: ${{ inputs.deploy-token }}' -F 'file=@dist.zip' -F 'project=${{ inputs.deploy-project-name }}' https://deploy.nexys.io/upload
          # remove created zip
          rm dist.zip
        else
          echo "not deploying, to deploy set 'deploy-project-name' and 'deploy-token'"
        fi
      shell: bash
