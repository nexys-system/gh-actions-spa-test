name: bun-spa-test
description: This GitHub Action will build, test, and deploy your SPA app using Bun
author: johnb8005
branding:
  icon: book-open
  color: purple
inputs:
  build-command:
    description: build command
    default: VITE_VERSION=${GITHUB_REF##*/} VITE_GIT_SHA=$GITHUB_SHA bun run build
  deploy-project-name:
    description: project name for the deploy service
  deploy-token:
    description: token needed to deploy
  dist-path:
    description: path to the dist folder (relative to repo root)
    default: dist
  gzip-compression:
    description: compresses files to gzip
    default: true
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v2
    - name: Install dependencies
      run: bun install
      shell: bash
    - name: Test
      run: bun test
      shell: bash
    - name: Build
      run: ${{ inputs.build-command }}
      shell: bash
    - name: Deploy
      if: ${{ inputs.deploy-project-name != '' && inputs.deploy-token != '' }}
      working-directory: ${{ inputs.dist-path }}
      run: |
        echo "deploying from ${{ inputs.dist-path }}"
        printf '{"sha":"%s","version":"%s","date":"%s"}' "$GITHUB_SHA" "${GITHUB_REF##*/}" "$(date -u)" > meta.json
        if [ "${{ inputs.gzip-compression }}" = "true" ] ; then
          echo "gzipping files"
          find . -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' \) -exec gzip "{}" \;
          find . -type f -name '*.gz' -exec sh -c 'mv "$0" "${0%.gz}"' {} \;
        fi
        zip -r "$GITHUB_WORKSPACE/dist.zip" .
        curl -f -X POST \
          -H 'X-TOKEN: ${{ inputs.deploy-token }}' \
          -F 'file=@'"$GITHUB_WORKSPACE"'/dist.zip' \
          -F 'project=${{ inputs.deploy-project-name }}' \
          https://deploy.nexys.io/upload
      shell: bash
